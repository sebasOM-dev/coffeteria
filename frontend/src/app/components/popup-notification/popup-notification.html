<div>
    <div class="popup" [style.backgroundColor]="backgroundColor()">
        <button class="popup-close">×</button>
        <div class="popup-content">
            <h2 class="popup-title" [style.color]="messageColor()">{{ title() }}</h2>
            <p class="popup-message" [style.color]="messageColor()">
                {{ message() }}
            </p>
        </div>
    </div>
</div>
