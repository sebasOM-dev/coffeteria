<!-- POPUP NOTIFICATION -->
@if (popupNotificationService._isVisible()) {
  <div style="position: fixed; top: 80dvh; left: 20px;">
    <app-popup-notification 
      [title]="popupNotificationService.popupMessage.title"
      [message]="popupNotificationService.popupMessage.message"
      [messageColor]="popupNotificationService.popupMessage.messageColor"
      [backgroundColor]="popupNotificationService.popupMessage.backgroundColor">
    </app-popup-notification>
  </div>
}
